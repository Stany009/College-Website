<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>St. Andrew's College | Gallery</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        .gallery-nav { text-align: center; margin: 2rem 0; }
        .gallery-nav button { background: none; border: 1px solid var(--primary); padding: 0.5rem 1rem; margin: 0.25rem; cursor: pointer; border-radius: 4px; font-family: var(--font-body); }
        .gallery-nav button.active, .gallery-nav button:hover { background: var(--primary); color: white; }
        
        .gallery-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 1rem; }
        .gallery-item { cursor: pointer; position: relative; overflow: hidden; border-radius: 8px; aspect-ratio: 4/3; background: #ddd; }
        .gallery-item img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.3s ease; }
        .gallery-item:hover img { transform: scale(1.05); }
        .gallery-item::after { content: attr(data-category); position: absolute; bottom: 0; left: 0; right: 0; background: rgba(0,0,0,0.6); color: white; padding: 0.5rem; text-align: center; opacity: 0; transition: opacity 0.3s; }
        .gallery-item:hover::after { opacity: 1; }

        .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000; justify-content: center; align-items: center; }
        .lightbox img { max-width: 90%; max-height: 90vh; object-fit: contain; }
        .lightbox-close { position: absolute; top: 1rem; right: 2rem; color: white; font-size: 2rem; cursor: pointer; }
        .lightbox-prev, .lightbox-next { position: absolute; top: 50%; color: white; font-size: 2rem; cursor: pointer; user-select: none; padding: 1rem; }
        .lightbox-prev { left: 1rem; }
        .lightbox-next { right: 1rem; }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="container">
            <h1 class="logo">St. Andrew's College</h1>
            <nav class="nav-links">
                <a href="index.html">Home</a>
                <a href="about.html">About</a>
                <a href="admissions.html">Admissions</a>
                <a href="departments.html">Departments</a>
                <a href="gallery.html">Gallery</a>
                <a href="student-portal.html">Student Portal</a>
                <a href="contact.html">Contact</a>
            </nav>
            <button class="hamburger" aria-label="Menu">☰</button>
        </div>
    </header>

    <main class="container page-content">
        <h2 class="page-title" style="text-align: center; margin-top: 2rem;">Gallery</h2>

        <div class="gallery-nav">
            <button class="filter-btn active" data-filter="all">All</button>
            <button class="filter-btn" data-filter="campus">Campus</button>
            <button class="filter-btn" data-filter="events">Events</button>
            <button class="filter-btn" data-filter="labs">Labs</button>
            <button class="filter-btn" data-filter="sports">Sports</button>
        </div>

        <section class="gallery-grid" id="galleryGrid">
            <!-- Simulated images using placeholder since we don't have actual images -->
            <div class="gallery-item" data-category="campus"><img src="https://via.placeholder.com/600x450?text=Campus+1" alt="Campus"></div>
            <div class="gallery-item" data-category="events"><img src="https://via.placeholder.com/600x450?text=Event+1" alt="Event"></div>
            <div class="gallery-item" data-category="labs"><img src="https://via.placeholder.com/600x450?text=Lab+1" alt="Lab"></div>
            <div class="gallery-item" data-category="sports"><img src="https://via.placeholder.com/600x450?text=Sports+1" alt="Sports"></div>
            <div class="gallery-item" data-category="campus"><img src="https://via.placeholder.com/600x450?text=Campus+2" alt="Campus"></div>
            <div class="gallery-item" data-category="events"><img src="https://via.placeholder.com/600x450?text=Event+2" alt="Event"></div>
        </section>
    </main>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox">
        <span class="lightbox-close" id="lightboxClose">&times;</span>
        <span class="lightbox-prev" id="lightboxPrev">&#10094;</span>
        <img src="" alt="Lightbox Image" id="lightboxImg">
        <span class="lightbox-next" id="lightboxNext">&#10095;</span>
    </div>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 St. Andrew's College. All rights reserved.</p>
        </div>
    </footer>
    <script src="js/script.js"></script>
    <script src="js/gallery.js"></script>
</body>
</html>
